name: GNI Market Pipeline
# P4 Stock Standby Architecture
# Fetches Yahoo Finance prices during NYSE hours
# Upserts to stock_prices Supabase table
# stocks page always shows data even when Yahoo is slow/down
#
# NYSE hours: 14:30-21:00 UTC Monday-Friday
# This runs every hour from 14:00-21:00 UTC weekdays
# Gives 7 fetch attempts per trading day per ticker

on:
  schedule:
    - cron: '0 14 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '0 17 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# S114 (OWASP A03/A08; GitHub Actions secure-use): least privilege for GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -c .github/constraints/python-3.11.txt \
            supabase \
            python-dotenv \
            requests

      - name: Fetch stock prices
        run: python ai_engine/fetch_prices.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_ACTIONS: "true"
      - name: Alert admin on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            -d chat_id="${ADMIN}" \
            --data-urlencode "text=⚠️ GNI market run FAILED -- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN: ${{ secrets.TELEGRAM_ADMIN_ID }}
