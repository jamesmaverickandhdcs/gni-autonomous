name: GNI CI -- Harnesses
# S93. GNI's FIRST push-triggered workflow. Layer 0 detector (ARCHITECTURE 8.4).
# NO SECRETS ARE PASSED. Deliberate and load-bearing: a hard boundary against
# quota spend, not a grep-based guess (R-S91-4).
# Exit codes are captured with '&& rc=0 || rc=$?' so the loop survives 'bash -e'
# and every harness reports, even after an earlier one fails.
on:
  push:
  workflow_dispatch:
# S114 (OWASP A03/A08; GitHub Actions secure-use): least privilege for GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  harnesses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            feedparser==6.0.12 \
            geopy==2.4.1 \
            supabase \
            python-dotenv \
            groq \
            requests \
            pytest==8.3.5
      # S111: the test_*.py files under ai_engine/tests ran nowhere - three are pytest
      # modules (def test_...), two are plain scripts that exit non-zero on failure.
      # Each now runs here the way it is written to run.
      - name: Run dry-run harnesses and tests
        run: |
          rm -f /tmp/harness_exits.txt
          fail=0
          for f in ai_engine/tests/dryrun_*.py ai_engine/tests/test_*.py; do
            echo "===== HARNESS $f ====="
            if grep -q '^def test_' "$f"; then
              timeout 120 python -m pytest -q -p no:cacheprovider "$f" && rc=0 || rc=$?
            else
              timeout 120 python "$f" && rc=0 || rc=$?
            fi
            echo "----- EXIT $f = $rc -----"
            echo "$f = $rc" >> /tmp/harness_exits.txt
            if [ "$rc" -ne 0 ]; then fail=1; fi
          done
          echo "===== PER-FILE EXIT CODES ====="
          cat /tmp/harness_exits.txt
          echo "===== JOB RESULT: fail=$fail ====="
          exit $fail
  rule_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Control probe -- fixture selftest
        run: |
          python tools/gni_rule_checks_fixture.py
      - name: Run document rule checks
        run: |
          python tools/gni_rule_checks.py . && rc=0 || rc=$?
          echo "===== rule_checks exit = $rc ====="
          exit $rc

